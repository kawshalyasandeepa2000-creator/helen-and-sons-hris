<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Reset password | Helen &amp; Sons HRIS</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f6f7fa; color: #000040; }
    header { background: #000040; color: white; padding: 20px clamp(16px, 5vw, 56px); font-weight: 800; letter-spacing: .045em; }
    header span { color: #f5bf2b; margin-right: 8px; }
    main { max-width: 490px; margin: clamp(36px,8vh,90px) auto; padding: 0 16px 56px; }
    .panel { background: #fff; border: 1px solid #e2e5ec; border-radius: 20px; padding: clamp(22px,5vw,36px); box-shadow: 0 14px 35px rgba(0,0,64,.06); }
    h1 { margin: 0 0 10px; font-size: 1.75rem; letter-spacing: -.03em; }
    p { color: #49506e; line-height: 1.55; }
    label { display: block; margin: 18px 0 7px; font-weight: 700; font-size: .93rem; }
    input { width: 100%; border: 1px solid #b8bed0; border-radius: 10px; padding: 13px 14px; font: inherit; }
    input:focus-visible, button:focus-visible, a:focus-visible { outline: 3px solid #e9b62d; outline-offset: 2px; }
    button { border: 0; border-radius: 100px; background: #000040; color: white; width: 100%; padding: 14px 16px; font: inherit; font-weight: 700; margin-top: 21px; cursor: pointer; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    [hidden] { display: none !important; }
    #message { margin-top: 16px; padding: 13px; border-radius: 10px; border: 1px solid #d7dcea; background: #f2f5fb; color: #20264f; line-height: 1.45; }
    #message.error { background: #fff3f2; border-color: #e8bbb6; color: #822b25; }
    #message.ok { background: #ecf8f1; border-color: #badfc9; color: #1d5c3d; }
    .foot { text-align: center; font-size: .85rem; margin-top: 20px; }
    a { color: #000040; font-weight: 700; }
  </style>
<link rel="stylesheet" href="css/premium-standalone.css?v=1">
<script>
  try { document.documentElement.dataset.theme =
    localStorage.getItem('helen-sons-hris-studio-theme') === 'dark' ? 'dark' : 'light'; }
  catch (_) { document.documentElement.dataset.theme = 'light'; }
</script>
<link rel="stylesheet" href="css/hris-two-tone-standalone.css?v=1">
</head>
<body class="premium-standalone" data-premium-page="reset">
<header><span>✦</span> HELEN &amp; SONS · HRIS</header>
<main>
  <section class="panel">
    <h1 id="heading">Reset your password</h1>
    <p id="intro">Enter your HRIS login email. We will send a one-time password-reset link.</p>
    <form id="requestForm" novalidate>
      <label for="email">Account email</label>
      <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com">
      <button id="requestBtn" type="submit">Email reset link</button>
    </form>
    <form id="passwordForm" hidden novalidate>
      <label for="password">New password</label>
      <input id="password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirm">Confirm new password</label>
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
      <button id="saveBtn" type="submit">Save new password</button>
    </form>
    <p id="message" role="status" aria-live="polite" hidden></p>
  </section>
  <p class="foot"><a href="/">Return to Helen &amp; Sons HRIS login</a></p>
</main>
<script src="/js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.0/dist/umd/supabase.min.js"></script>
<script>
(() => {
  'use strict';
  const cfg = window.HRIS_CONFIG || {};
  const heading = document.getElementById('heading');
  const intro = document.getElementById('intro');
  const requestForm = document.getElementById('requestForm');
  const passwordForm = document.getElementById('passwordForm');
  const message = document.getElementById('message');
  const showMessage = (text, type = '') => { message.hidden = false; message.className = type; message.textContent = text; };
  const hasError = new URLSearchParams(location.hash.slice(1)).get('error_description') || new URLSearchParams(location.search).get('error_description');
  const hashParams = new URLSearchParams(location.hash.slice(1));
  const queryParams = new URLSearchParams(location.search);
  const isRecoveryLink = ['recovery','invite'].includes(hashParams.get('type')) || queryParams.has('code');

  if (!cfg.supabaseUrl || !cfg.supabasePublishableKey || !window.supabase?.createClient) {
    requestForm.hidden = true;
    showMessage('This page is not configured. Ask the HRIS administrator to check the deployed public Supabase configuration.', 'error');
    return;
  }
  const client = window.supabase.createClient(cfg.supabaseUrl, cfg.supabasePublishableKey, {
    auth: { autoRefreshToken: true, persistSession: false, detectSessionInUrl: true }
  });

  function showPasswordForm() {
    heading.textContent = 'Choose a new password';
    intro.textContent = 'Your secure recovery or invitation link has been verified. Set a password of at least 12 characters.';
    requestForm.hidden = true;
    passwordForm.hidden = false;
    message.hidden = true;
    // Supabase finishes processing recovery tokens before the URL is cleaned.
    history.replaceState({}, document.title, location.pathname);
  }

  if (hasError) {
    showMessage('This password-reset link is expired or invalid. Request a new one below.', 'error');
  }

  client.auth.onAuthStateChange(async (event, session) => {
    if ((event === 'PASSWORD_RECOVERY' || (isRecoveryLink && event === 'SIGNED_IN')) && session) {
      showPasswordForm();
    }
  });

  if (isRecoveryLink) {
    // Covers direct page load where the auth event fires before the listener, and PKCE redirects.
    client.auth.getSession().then(({data, error}) => {
      if (!error && data?.session && passwordForm.hidden) showPasswordForm();
      else if (error) showMessage('This reset link could not be verified. Please request a new link.', 'error');
    });
  }

  requestForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const email = document.getElementById('email').value.trim();
    if (!email || !document.getElementById('email').checkValidity()) { showMessage('Enter a valid email address.', 'error'); return; }
    const button = document.getElementById('requestBtn');
    button.disabled = true;
    try {
      const redirectTo = new URL('/reset-password.html', location.origin).href;
      const {error} = await client.auth.resetPasswordForEmail(email, {redirectTo});
      if (error) throw error;
      showMessage('If the account exists, a reset link has been requested. Check the inbox and spam folder.', 'ok');
    } catch (error) {
      showMessage('Unable to request a reset link: ' + (error?.message || 'Please try again later.'), 'error');
    } finally { button.disabled = false; }
  });

  passwordForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password.length < 12) { showMessage('Use a password of at least 12 characters.', 'error'); return; }
    if (password !== confirm) { showMessage('Passwords do not match.', 'error'); return; }
    const button = document.getElementById('saveBtn');
    button.disabled = true;
    try {
      const {data, error} = await client.auth.getSession();
      if (error || !data?.session) throw new Error('Reset session expired. Request another reset email.');
      const result = await client.auth.updateUser({password});
      if (result.error) throw result.error;
      document.getElementById('password').value = '';
      document.getElementById('confirm').value = '';
      await client.auth.signOut();
      passwordForm.hidden = true;
      intro.textContent = 'Your password has been saved. Return to the Helen & Sons HRIS home page and sign in with your email and new password.';
      showMessage('Password saved successfully. Use the HRIS login link below.', 'ok');
    } catch (error) {
      showMessage('Password update failed: ' + (error?.message || 'Please request a fresh reset link.'), 'error');
    } finally { button.disabled = false; }
  });
})();
</script>
</body>
</html>
